# Goal - Ensure the docker files and Docker images are security Tested
#
# CHANGED from original:
#   - removed `continue-on-error: true` on the Trivy step — previously a
#     CRITICAL CVE would show in logs but never fail the build. Now it does.
#   - severity widened to HIGH,CRITICAL (was CRITICAL only)
#   - ignore-unfixed removed — an unfixed HIGH/CRITICAL is still a real risk,
#     just one you can't patch yet; better to see it and decide, not hide it
name: Docker Scan

on:
  workflow_call:

jobs:
  docker-file-lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend']
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: ${{ matrix.folders }} Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile
          failure-threshold: warning

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build ${{ matrix.folders }}
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ github.sha }} .
        working-directory: ${{ matrix.folders }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        # NOTE: no continue-on-error here — this is now a real gate
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'